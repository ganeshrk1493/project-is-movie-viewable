name: "Ingestion Job Container CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "ingestion/**"
      - "monitoring/**"
      - ".github/workflows/ingestion-job-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-is-movie-viewable
  REGION: asia-south1
  REPO_NAME: movie-pipelines
  IMAGE_NAME: movie-batch-ingestor

jobs:
  build-and-deploy:
    name: "Build & Update Cloud Run Job"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/792044975357/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "terraform-ci-sa@project-is-movie-viewable.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}"
          docker build -f ingestion/Dockerfile -t "${IMAGE_URI}:latest" -t "${IMAGE_URI}:${{ github.sha }}" .
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${{ github.sha }}"

      - name: Update Cloud Run Jobs (Ingestion + Daily Auditor)
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          for JOB_NAME in movie-batch-ingestor daily-pipeline-auditor; do
            if gcloud run jobs describe "$JOB_NAME" --region=${{ env.REGION }} >/dev/null 2>&1; then
              gcloud run jobs update "$JOB_NAME" --region=${{ env.REGION }} --image="$IMAGE_TAG"
            fi
          done